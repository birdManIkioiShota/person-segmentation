[project]
name = "person-segmentation"
version = "0.1.0"
description = "SAM 3による人物切り抜き用スクリプト"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    "pillow>=10",
    "setuptools<81",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "sam3 @ git+https://github.com/facebookresearch/sam3.git@0570b3a5be9c4e694f23d85232fb55f4a6f1f7fc",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
